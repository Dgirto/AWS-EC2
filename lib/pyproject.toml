[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-ec2-connector"
version = "1.0.0"
description = "Conector Ruvic de consulta y control de instancias AWS EC2"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34,<2.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_ec2_connector*"]
